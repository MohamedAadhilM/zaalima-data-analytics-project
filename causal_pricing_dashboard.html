<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--bg:#f2f4f8;--card:#fff;--tx:#1b2a41;--mu:#5b6b82;--bd:#e2e8f0;--gr:rgba(120,130,150,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1624;--card:#18223a;--tx:#e8edf6;--mu:#9fb0c8;--bd:#2a3856;--gr:rgba(160,175,200,.18)}}
html{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px "Segoe UI",system-ui,sans-serif;padding:14px}
h1{font-size:19px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 12px}
.g{display:grid;gap:12px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;min-width:0}
.k .c b{display:block;font-size:24px;color:#1f77b4}.k .c span{color:var(--mu);font-size:12px}
h2{font-size:13px;margin:0 0 8px}.box{position:relative;height:250px}
label{display:flex;justify-content:space-between;margin:6px 0 2px;color:var(--mu);font-size:12px}
input[type=range],select{width:100%}select{padding:4px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.warn{color:#d62728;min-height:18px;font-size:12px}.note{color:var(--mu);font-size:12px;margin-top:12px}
.tag{padding:1px 7px;border-radius:9px;color:#fff;font-size:11px}
